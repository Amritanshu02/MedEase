spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medlocal
    username: medlocal_user
    password: medlocal_pass
  jpa:
    hibernate:
      ddl-auto: none  # We use Flyway for migrations
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

medlocal:
  app:
    jwtSecret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkw}  # base64 of "abcdefghijklmnopqrstuvwxyz0123456789", override with JWT_SECRET env var
    jwtExpirationMilliseconds: 86400000