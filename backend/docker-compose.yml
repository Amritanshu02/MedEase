version: '3.8'

services:
  medlocal:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/medlocal_db
      SPRING_DATASOURCE_USERNAME: medlocal
      SPRING_DATASOURCE_PASSWORD: StrongPassword123!
      MEDLOCAL_APP_JWTSECRET: YOUR_BASE64_ENCODED_256_BIT_SECRET_HERE
      MEDLOCAL_APP_JWTEXPIRATIONMILLISECONDS: 86400000
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: medlocal_postgres
    environment:
      POSTGRES_USER: medlocal
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: medlocal_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: